name: monitored-exclusion
channels:
  - conda-forge
dependencies:
  - python>=3.11
  - numpy>=2.0
  - scipy>=1.11
  - matplotlib>=3.8
  - pandas>=2.0
  - jupyterlab>=4.0
  # The engine in Simulator/cpp/ is a C++20 extension compiled on
  # installation, so the environment carries its own compiler rather than
  # assuming a system one.
  - cxx-compiler>=1.7
  # setup_cpp.py drives the build through setuptools.  Python no longer ships
  # it -- the bundled copy went away in 3.12 -- so an environment resolving to
  # a recent interpreter has none unless it is asked for here.
  - setuptools>=68
